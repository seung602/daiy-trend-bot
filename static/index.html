<!doctype html>
<html lang="ko" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K-Beauty Trend Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow" data-i18n="eyebrow">K-BEAUTY DATA INTELLIGENCE</div>
        <h1 data-i18n="title">K-Beauty Trend Intelligence</h1>
        <div id="dateLabel" class="muted">—</div>
      </div>
      <div class="header-actions">
        <label class="lang-label" for="language">🌐</label>
        <select id="language" aria-label="Language">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ar">العربية</option>
        </select>
      </div>
    </header>

    <main>
      <section id="dashboardView">
        <div class="kpi-grid">
          <article class="kpi"><span data-i18n="keywords">키워드</span><strong id="kpiKeywords">—</strong></article>
          <article class="kpi"><span data-i18n="avgScore">평균 점수</span><strong id="kpiAvg">—</strong></article>
          <article class="kpi"><span data-i18n="rising">급상승</span><strong id="kpiRising">—</strong></article>
          <article class="kpi"><span data-i18n="signals">원본 신호</span><strong id="kpiSignals">—</strong></article>
        </div>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2 data-i18n="topTrends">오늘의 TOP 트렌드</h2>
              <p class="muted" data-i18n="clickHint">키워드를 클릭하면 상세 분석을 볼 수 있습니다.</p>
            </div>
            <button class="ghost" id="refreshBtn" data-i18n="refresh">새로고침</button>
          </div>
          <div id="trendList" class="trend-list"></div>
        </section>

        <section class="panel chart-panel">
          <div class="panel-head"><h2 data-i18n="topHistory">TOP 키워드 추이</h2></div>
          <div class="chart-wrap"><canvas id="topChart"></canvas></div>
        </section>
      </section>

      <section id="detailView" class="hidden">
        <button id="backBtn" class="back-btn">← <span data-i18n="back">뒤로</span></button>
        <div class="detail-title-row">
          <div>
            <div class="eyebrow" data-i18n="keywordDetail">KEYWORD DETAIL</div>
            <h2 id="detailKeyword">—</h2>
            <span id="detailStatus" class="status-badge">—</span>
          </div>
          <div class="score-hero"><span data-i18n="trendScore">트렌드 점수</span><strong id="detailScore">—</strong></div>
        </div>

        <div id="breakdownGrid" class="breakdown-grid"></div>

        <section class="panel chart-panel">
          <div class="panel-head"><h2 data-i18n="scoreHistory">Trend Score History</h2></div>
          <div class="chart-wrap"><canvas id="scoreChart"></canvas></div>
        </section>

        <section class="panel chart-panel">
          <div class="panel-head">
            <div>
              <h2 data-i18n="platformTrend">플랫폼별 추이</h2>
              <p class="muted" data-i18n="platformHint">최근 30일 언급량</p>
            </div>
          </div>
          <div class="chart-wrap"><canvas id="platformChart"></canvas></div>
        </section>

        <section class="two-col">
          <section class="panel">
            <div class="panel-head"><h2 data-i18n="regions">지역별 신호</h2></div>
            <div id="regionList" class="region-list"></div>
          </section>
          <section class="panel">
            <div class="panel-head"><h2 data-i18n="signalsDetail">원본 신호</h2></div>
            <div id="signalList" class="signal-list"></div>
          </section>
        </section>
      </section>
    </main>

    <footer class="footer"><span data-i18n="readOnly">Read-only analytics dashboard · SQLite source</span></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
