name: Daily Cosmetics Trend Bot

on:
  schedule:
    # UTC 기준 05:00 (한국 시간 14:00 / CET 기준 06:00~07:00)
    - cron: '0 5 * * *'
  workflow_dispatch:

# DB 파일 push를 위해 repository 쓰기 권한 설정
permissions:
  contents: write

jobs:
  run-trend-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Gemini model in code (Debug)
        run: |
          echo "Checking model configuration in main.py:"
          grep -n "gemini-" main.py || true

      - name: Run Trend Bot Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python main.py

      - name: Commit and Push DB Changes
        if: always() # 스크립트 성공/실패 여부와 관계없이 DB 백업 시도
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add beauty_trends.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update beauty_trends.db [skip ci]" && git push)
