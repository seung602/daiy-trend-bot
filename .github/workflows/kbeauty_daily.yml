name: K-Beauty Daily Trend Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run K-Beauty daily report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main_kbeauty_final_youtube.py

      - name: Commit trend database
        if: success()
        run: |
          git config user.name "kbeauty-bot"
          git config user.email "kbeauty-bot@users.noreply.github.com"
          git add beauty_trends.db

          if git diff --cached --quiet; then
            echo "No changes to beauty_trends.db, skipping commit."
          else
            git commit -m "Update trend database ($(TZ=Europe/Amsterdam date +%Y-%m-%d))"
            git push
          fi

      # 통합 웹 서버 재배포 트리거
      - name: Trigger unified web deploy
        run: curl -fsS -X POST "https://api.render.com/deploy/srv-da0k57dbedkc73auvn5g?key=MydIcmRe06I"
