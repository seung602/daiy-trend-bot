name: K-Beauty Daily Trend Report

on:
  schedule:
    # Summer time (CEST): 05:00 UTC = 07:00 Amsterdam
    - cron: "0 5 * * *"

    # Winter time (CET): 06:00 UTC = 07:00 Amsterdam
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Amsterdam time
        id: timecheck
        run: |
          HOUR="$(TZ=Europe/Amsterdam date +%H)"
          echo "Amsterdam local time: $(TZ=Europe/Amsterdam date)"

          if [ "${HOUR}" = "07" ]; then
            echo "run_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.timecheck.outputs.run_report == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.timecheck.outputs.run_report == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run K-Beauty Trend Report
        if: steps.timecheck.outputs.run_report == 'true' || github.event_name == 'workflow_dispatch'
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python main_kbeauty_final.py
