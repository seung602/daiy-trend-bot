name: K-Beauty Daily Trend Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run K-Beauty daily report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main_kbeauty_final_youtube.py

      - name: Commit trend database
        if: success()
        run: |
          git config user.name "kbeauty-bot"
          git config user.email "kbeauty-bot@users.noreply.github.com"
          git add beauty_trends.db

          if git diff --cached --quiet; then
            echo "No changes to beauty_trends.db, skipping commit."
          else
            git commit -m "Update trend database ($(TZ=Europe/Amsterdam date +%Y-%m-%d))"
            git push
          fi
name: Daily Collector Bot

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 UTC 00:00 (한국 시간 오전 9시) 실행
  workflow_dispatch:      # GitHub 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. 파이썬 의존성 패키지 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f oliveyoung-beauty-trend-bot/requirements.txt ]; then
            pip install -r oliveyoung-beauty-trend-bot/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 2. 🔹 Playwright Chromium 브라우저 및 시스템 라이브러리 설치 (에러 해결 핵심)
      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      # 3. 크롤링 스크립트 실행
      - name: Run Daily Collector
        run: |
          if [ -f oliveyoung-beauty-trend-bot/run_daily.py ]; then
            python oliveyoung-beauty-trend-bot/run_daily.py
          else
            python run_daily.py
          fi

      # 4. 결과 저장 및 Push
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily trend data" && git push)
      - name: Trigger unified web deploy
        run: curl -fsS -X POST "https://api.render.com/deploy/srv-da0k57dbedkc73auvn5g?key=MydIcmRe06I"
