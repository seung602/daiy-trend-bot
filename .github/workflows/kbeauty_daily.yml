name: K-Beauty Daily Trend Report

on:
  # GitHub Actions uses UTC. We trigger at both 05:00 and 06:00 UTC
  # and keep only the run that is exactly 07:00 in Europe/Amsterdam.
  # 05:00 UTC = 07:00 CEST (summer)
  # 06:00 UTC = 07:00 CET  (winter)
  schedule:
    - cron: '0 5,6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Amsterdam time
        id: local_time
        shell: bash
        run: |
          # 수동 실행(workflow_dispatch)인 경우 시간 검사 없이 항상 실행
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected. Running report regardless of time."
            echo "run_report=true" >> "$GITHUB_OUTPUT"
          else
            # 자동 예약 실행(schedule)인 경우 암스테르담 기준 07시일 때만 실행
            HOUR="$(TZ=Europe/Amsterdam date +%H)"
            echo "Amsterdam local hour: ${HOUR}"
            if [ "${HOUR}" = "07" ]; then
              echo "run_report=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_report=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # SQLite contains both the 7-day trend history and the monthly API quota ledger.
      # Restore the newest cache entry from the same branch before running.
      - name: Restore trend database
        if: steps.local_time.outputs.run_report == 'true'
        uses: actions/cache/restore@v4
        with:
          path: beauty_trends.db
          key: kbeauty-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            kbeauty-db-${{ github.ref_name }}-

      - name: Set up Python
        if: steps.local_time.outputs.run_report == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # apify-client 라이브러리는 스크립트에서 import하지 않음(Apify는 requests로
      # 직접 REST 호출). 안 쓰는 패키지라 설치 목록에서 제거.
      - name: Install dependencies
        if: steps.local_time.outputs.run_report == 'true'
        run: python -m pip install --upgrade pip requests

      - name: Run K-Beauty daily report
        if: steps.local_time.outputs.run_report == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # gemini-1.5-flash는 404를 반환해 매번 코드의 폴백(gemini-3.5-flash-lite)
          # 재시도를 태우고 있었다. 처음부터 정상 동작이 확인된 모델로 되돌린다.
          GEMINI_MODEL: gemini-3.6-flash
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python main_kbeauty_final.py

      # Every successful run gets a fresh cache key, so the next day's restore-key
      # finds the latest database. This preserves monthly quota and 7-day history.
      - name: Save trend database
        if: steps.local_time.outputs.run_report == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: beauty_trends.db
          key: kbeauty-db-${{ github.ref_name }}-${{ github.run_id }}
