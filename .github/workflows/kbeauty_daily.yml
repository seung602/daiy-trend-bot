name: Daily Cosmetics Trend Report

on:
  schedule:
    # GitHub Actions는 UTC 기준
    # 여름시간(CEST): 05:00 UTC = 암스테르담 07:00
    - cron: "0 5 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests urllib3
          fi

      # 4. Run Daily Trend Bot
      - name: Run Daily Trend Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TREND_DB_PATH: beauty_trends.db
        run: |
          echo "========================================"
          echo "Starting Daily Cosmetics Trend Bot"
          echo "========================================"

          python main_kbeauty_final.py

      # 5. Save SQLite database
      - name: Commit database changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add beauty_trends.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update daily trend database"
            git push
          fi
